<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Input Controls</title>
  </head>
  <body>
    <h1>HTML Input Controls</h1>

    <form>
      <h3>Text Inputs</h3>
      Name: <input type="text" /><br /><br />
      Email: <input type="email" /><br /><br />
      Password: <input type="password" /><br /><br />

      <h3>Numbers & Date</h3>
      Age: <input type="number" /><br /><br />
      Birthday: <input type="date" /><br /><br />

      <h3>Radio (Single Choice)</h3>
      <input type="radio" name="gender" /> Male
      <input type="radio" name="gender" /> Female<br /><br />

      <h3>Checkbox (Multiple Choice)</h3>
      <input type="checkbox" /> Music
      <input type="checkbox" /> Sports<br /><br />

      <h3>Other Inputs</h3>
      File: <input type="file" /><br /><br />
      Color: <input type="color" /><br /><br />
      Range: <input type="range" /><br /><br />

      <h3>Buttons</h3>
      <input type="submit" />
      <input type="reset" />
    </form>
  </body>
</html>
