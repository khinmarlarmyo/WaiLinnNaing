  <body>
    <button onclick="history.back()">Go Back</button>
    <h1>Quotes & Citations</h1>

    <h2>Blockquote (Long Quote)</h2>
    <blockquote>
      The journey of a thousand miles begins with a single step.
    </blockquote>

    <p>This is used for long quotations from external sources.</p>

    <h2>Inline Quote</h2>
    <p>As someone once said, <q>Practice makes perfect</q>.</p>

    <h2>Citation</h2>
    <p>This quote is from <cite>Lao Tzu</cite>.</p>
  </body>
