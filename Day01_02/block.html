<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Block & Inline - METATEAM</title>
    <style>
      .block-el {
        background: tomato;
        margin-bottom: 5px;
        color: white;
        padding: 5px;
      }
      .inline-el {
        background: yellow;
        padding: 2px;
      }
    </style>
  </head>
  <body>
    <button onclick="history.back()">Go Back</button>
    <h1>Layout Flow</h1>
    <div class="block-el">I am a Block element (I take up the full width).</div>
    <div class="block-el">I am another Block element.</div>
    <span class="inline-el">I am Inline</span>
    <span class="inline-el">We stay on the same line</span>
  </body>
</html>
