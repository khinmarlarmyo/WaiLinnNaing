<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>HTML Multimedia</title>
  </head>
  <body>
    <h1>HTML Multimedia</h1>

    <h2>Audio Example</h2>
    <audio controls>
      <source src="img/birdsing.mp3" type="audio/mpeg" />
      Your browser does not support audio.
    </audio>

    <h2>Video Example</h2>
    <video width="400" controls>
      <source
        src="https://www.youtube.com/watch?v=kP9TfCWaQT4"
        type="video/mp4"
      />
      Your browser does not support video.
    </video>

    <p>
      The <code>&lt;audio&gt;</code> and <code>&lt;video&gt;</code> tags allow
      media playback. The <code>controls</code> attribute adds play, pause, and
      volume buttons.
    </p>
  </body>
</html>
