<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>METATEAM MYANMAR| Contact</title>
    <link rel="shortcut icon" href="img/mlogo.png" type="image/x-icon" />
    <link rel="stylesheet" href="css/normalize.css" />
    <link rel="stylesheet" href="css/contact.css" />
  </head>
  <body>
    <button onclick="history.back()">Go Back</button>
    <form action="/Day01_02/index.html" method="GET">
      <fieldset class="contact-group">
        <legend>Contact Information</legend>

        <!-- Text Input for Name -->
        <div class="field">
          <label for="user-name">Full Name</label>
          <input
            type="text"
            id="user-name"
            name="fullname"
            placeholder="Jane Doe"
            required
          />
        </div>

        <!-- Email Input (includes built-in validation) -->
        <div class="field">
          <label for="user-email">Email Address</label>
          <input
            type="email"
            id="user-email"
            name="email"
            placeholder="jane@example.com"
            required
          />
        </div>

        <!-- Tel Input for Phone Numbers -->
        <div class="field">
          <label for="user-phone">Phone Number</label>
          <input
            type="tel"
            id="user-phone"
            name="phone"
            placeholder="09963******"
            pattern="[0-9]{9,}"
          />
        </div>
        <div class="field">
          <button type="submit">Send Message</button>
        </div>
      </fieldset>
      <img src="img/smiley-smiley-face.gif" class="img1" alt="" />
      <img src="img/smiley-smiley-face.gif" class="img2" alt="" />
    </form>
  </body>
</html>
