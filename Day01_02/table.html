<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>METATEAM MYANMAR| Table</title>
    <link rel="stylesheet" href="css/normalize.css" />
    <link rel="shortcut icon" href="img/mlogo.png" type="image/x-icon" />

    <style>
      table {
        width: 100%;
        border-collapse: collapse;
      }

      th,
      td {
        border: 1px solid black;
        padding: 10px;
        text-align: left;
      }

      thead {
        background-color: #333;
        color: white;
      }

      tbody tr:nth-child(even) {
        background-color: #f2f2f2;
      }

      tbody tr:hover {
        background-color: #ddd;
      }
    </style>
  </head>
  <body>
    <h2>Student Table</h2>

    <table>
      <caption>
        Student Information
      </caption>

      <thead>
        <tr>
          <th>Name</th>
          <th>Age</th>
          <th>Country</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <td>John</td>
          <td>25</td>
          <td>USA</td>
        </tr>
        <tr>
          <td>Alice</td>
          <td>30</td>
          <td>UK</td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
