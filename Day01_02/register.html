<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>METATEAM MYANMAR| Register</title>
    <link rel="stylesheet" href="css/normalize.css" />
    <link rel="shortcut icon" href="img/mlogo.png" type="image/x-icon" />
    <link rel="stylesheet" href="css/register.css" />
  </head>
  <body>
    <button onclick="history.back()">Go Back</button>
    <div class="container">
      <div class="left-side">
        <img
          src="img/welcome.gif"
          alt=""
          style="width: 20vw; height: fit-content"
        />
      </div>
      <div class="registerForm">
        <h3>METATEAM Internship Register Form</h3>
        <img src="img/smiley-smiley-face.gif" alt="" />
        <form action="/submit-registration" validate method="POST">
          <div class="form-group">
            <label for="fullname">Full Name:</label>
            <input
              type="text"
              id="fullname"
              name="fullname"
              placeholder="John Doe"
              required
              pattern="[A-Za-z ]{3,}"
            />
          </div>
          <div class="form-group">
            <label for="email">Email Address:</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="email"
              required
            />
          </div>
          <div class="form-group">
            <label for="pwd">Password:</label>
            <input
              type="password"
              id="pwd"
              name="pwd"
              minlength="8"
              placeholder="Enter Your Password"
            />
          </div>
          <div class="form-group">
            <label for="age">Age:</label>
            <input
              type="number"
              id="age"
              name="age"
              placeholder="Enter Your Age"
              min="18"
              max="99"
            />
          </div>

          <div class="form-group">
            <label>Gender:</label>
            <div class="options">
              <label
                ><input type="radio" name="gender" value="male" required />
                Male</label
              >
              <label
                ><input type="radio" name="gender" value="female" />
                Female</label
              >
            </div>
          </div>
          <div class="form-group">
            <label for="dob">Date Of Birth</label>
            <input
              type="date"
              name="dob"
              id="dob"
              placeholder="Date Of Birth"
            />
          </div>
          <div class="form-group">
            <label>Interests:</label>
            <div class="options">
              <label
                ><input type="checkbox" name="interest[]" value="coding" />
                Coding</label
              >
              <label
                ><input type="checkbox" name="interest[]" value="music" />
                Music</label
              >
            </div>
          </div>
          <div class="form-group">
            <label for="field">Interesting Fields:</label>
            <select id="field" name="field">
              <option value="Frontend">Frontend</option>
              <option value="Backend">Backend</option>
              <option value="Analyst">Analyst</option>
              <option value="AI">AI</option>
            </select>
          </div>

          <div class="form-group">
            <label for="bio">Short Bio:</label>
            <textarea id="bio" name="bio" rows="4" cols="30"></textarea>
          </div>
          <div style="display: flex; justify-content: end">
            <button type="reset">Reset Form</button>

            <button type="submit">Register Now</button>
          </div>
        </form>
      </div>
      <div class="right-side"></div>
    </div>
  </body>
</html>
