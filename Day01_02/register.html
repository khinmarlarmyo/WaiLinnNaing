<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>METATEAM|MYANMAR</title>
    <link rel="shortcut icon" href="img/mlogo.png" type="image/x-icon" />
    <link rel="stylesheet" href="css/register.css" />
  </head>
  <body>
    <button onclick="history.back()">Go Back</button>
    <div class="registerForm">
      <h3>METATEAM Internship Register Form</h3>

      <form action="/submit-registration" validate method="POST">
        <div>
          <label for="fullname">Full Name:</label>
          <input
            type="text"
            id="fullname"
            name="fullname"
            placeholder="John Doe"
            required
          />
        </div>
        <div>
          <label for="email">Email Address:</label>
          <input type="email" id="email" name="email" required />
        </div>
        <div>
          <label for="pwd">Password:</label>
          <input type="password" id="pwd" name="pwd" minlength="8" />
        </div>
        <div>
          <label for="age">Age:</label>
          <input type="number" id="age" name="age" min="18" max="99" />
        </div>

        <div>
          <p>Gender:</p>
          <input type="radio" id="male" name="gender" value="male" />
          <label for="male">Male</label>
          <input type="radio" id="female" name="gender" value="female" />
          <label for="female">Female</label>
        </div>

        <div>
          <p>Interests:</p>
          <input type="checkbox" id="coding" name="interest" value="coding" />
          <label for="coding">Coding</label>
          <input type="checkbox" id="music" name="interest" value="music" />
          <label for="music">Music</label>
        </div>

        <div>
          <label for="field">Interesting Fields:</label>
          <select id="field" name="field">
            <option value="Frontend">Frontend</option>
            <option value="Backend">Backend</option>
            <option value="Analyst">Analyst</option>
            <option value="AI">AI</option>
          </select>
        </div>

        <div>
          <label for="bio">Short Bio:</label>
          <textarea id="bio" name="bio" rows="4" cols="30"></textarea>
        </div>
        <div style="display: flex; justify-content: end">
          <button type="reset">Reset Form</button>

          <button type="submit">Register Now</button>
        </div>
      </form>
    </div>
  </body>
</html>
