<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Swiper demo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1" />
  <!-- Link Swiper's CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />
  <style>
    body{
      position: relative;
    }
    .swiper-slide{
background-color: rgb(200, 121, 2);
width: 800px;
height: 300px;
    }
    /* h1{
      background-color: aqua;
    } */
  </style>
</head>

<body>
<div class="swiper mySwapper">
  <div class="swiper-wrapper">
    <div class="swiper-slide">
      <h1>Hello</h1>
    </div>
    <div class="swiper-slide">
      <h1>Hello</h1>
    </div>
    <div class="swiper-slide">
      <h1>Hello</h1>
    </div>
    <div class="swiper-slide">
      <h1>Hello</h1>
    </div>
    <div class="swiper-slide">
      <h1>Hello</h1>
    </div>
    <div class="swiper-slide">
      <h1>Hello</h1>
    </div>
  </div>
    <div class="swiper-pagination"></div>

</div>
  <!-- Swiper JS -->
  <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
  
  <!-- Initialize Swiper -->
  <script>
    var swiper = new Swiper(".mySwapper", {
      effect: "coverflow",
      grabCursor: true,
      centeredSlides: true,
      slidesPerView: "auto",
      coverflowEffect: {
        rotate: 50,
        stretch: 0,
        depth: 100,
        modifier: 1,
        slideShadows: true,
      },
      pagination: {
        el: ".swiper-pagination",
      },
    });
  </script>
</body>

</html>
