<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vertical Swiper Layout</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />

  <style>
    html,
    body {
      /* position: relative; */
      /* height: 100%; */
    }

 

    .swiper {
      width: 100%;
      height: 100%;
    }

    .swiper-slide {
      text-align: center;
      font-size: 18px;
      background: #444;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .swipe-parent{
      height: 250px;
      /* position: relative; */
    }
  </style>
</head>

<body>
 <div class="swipe-parent">

 
    <div class="swiper mySecondlink">
      <div class="swiper-wrapper">

        <div class="swiper-slide">
          hello I
        </div>
        <div class="swiper-slide">
          hello II
        </div>
      </div>

      <div class="swiper-pagination"></div>
    </div> 
    </div>
  <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>

  <script>
    var swiper = new Swiper(".mySecondlink", {
      direction: "vertical",
      slidesPerView: 1,
      spaceBetween: 0, // Cleared out extra spacer conflicts
      mousewheel: true,
      pagination: {
        el: ".swiper-pagination",
        clickable: true,
      },
    });
  </script>
</body>

</html>
